name: Quebra de compatibilidade com o DSH
description: Uma versão nova do DeepSeek Harness quebrou o plugin. O relato mais útil deste repositório.
title: "[compat] rc.X -> rc.Y: "
labels: ["compat", "upstream-break", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Todo o ecossistema `@deepseek-ai/*` está em versões `rc` e o próprio projeto a montante
        avisa que espera mudanças incompatíveis. Este formulário existe para transformar essa
        dor em dado: alimenta a matriz de compatibilidade.

        **Armadilha conhecida do registry:** a tag `latest` dos subpacotes `@deepseek-ai/dsh-*`
        aponta para a publicação **mais antiga**, não para a mais recente. Confirme a versão
        realmente instalada antes de reportar.
  - type: input
    id: rc-old
    attributes:
      label: Versão do DSH em que funcionava
      placeholder: "0.1.0-rc.7"
    validations:
      required: true
  - type: input
    id: rc-new
    attributes:
      label: Versão do DSH em que quebrou
      placeholder: "0.1.0-rc.10"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Versão do plugin usada nas duas
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Natureza da quebra
      options:
        - Símbolo desapareceu (import falha / propriedade indefinida)
        - Assinatura mudou (tipos deixam de compilar)
        - Comportamento mudou em silêncio (compila, faz outra coisa)
        - Pacote renomeado ou removido do registry
        - Não sei dizer
    validations:
      required: true
  - type: textarea
    id: symbol
    attributes:
      label: Símbolo, pacote e caminho
      description: "Ex.: `WebServer.registerUpgrade` em `@deepseek-ai/dsh-host-webserver`. Se conseguir, cole o trecho do `.d.ts` antigo e do novo."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência
      description: "Erro do compilador, rastreio de execução ou saída do `curl`. Redija segredos."
    validations:
      required: true
  - type: checkboxes
    id: verified
    attributes:
      label: Como você verificou
      options:
        - label: Li o `.d.ts` publicado no tarball do npm, não apenas documentação em prosa.
          required: false
        - label: Confirmei a versão exata instalada (`pnpm why` / `npm ls`), não a tag `latest`.
          required: false
